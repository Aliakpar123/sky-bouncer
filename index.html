<!DOCTYPE html>

<head>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #0a0a2e;
  touch-action: none;
  -webkit-user-select: none; user-select: none;
}
canvas { display: block; }

/* UI Overlay */
.overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 10; pointer-events: none;
}
.overlay.active { pointer-events: all; }

/* Menu Screen */
#menuScreen {
  background: linear-gradient(180deg, #1a0a3e 0%, #0a0a2e 100%);
}
#menuScreen .title {
  font-size: 48px; font-weight: 900; color: #fff;
  text-shadow: 0 0 30px rgba(110, 60, 255, 0.8), 0 4px 8px rgba(0,0,0,0.5);
  margin-bottom: 8px; letter-spacing: -1px;
}
#menuScreen .subtitle {
  font-size: 18px; color: rgba(255,255,255,0.6); margin-bottom: 40px;
}
.btn {
  padding: 16px 48px; border: none; border-radius: 50px; font-size: 20px;
  font-weight: 700; cursor: pointer; transition: all 0.2s;
  text-transform: uppercase; letter-spacing: 2px;
}
.btn-play {
  background: linear-gradient(135deg, #6e3cff, #b84cff);
  color: #fff; box-shadow: 0 8px 32px rgba(110, 60, 255, 0.5);
}
.btn-play:active { transform: scale(0.95); }
.best-score {
  margin-top: 24px; font-size: 16px; color: rgba(255,255,255,0.5);
}

/* HUD */
#hud {
  position: fixed; top: 0; left: 0; width: 100%; padding: 16px 20px;
  display: flex; justify-content: space-between; align-items: center;
  z-index: 5; display: none;
}
#hud .score {
  font-size: 36px; font-weight: 900; color: #fff;
  text-shadow: 0 2px 8px rgba(0,0,0,0.5);
}
#hud .coin-count {
  font-size: 20px; font-weight: 700; color: #ffd700;
  text-shadow: 0 2px 8px rgba(0,0,0,0.5);
}

/* Game Over */
#gameOverScreen {
  background: rgba(10, 10, 46, 0.95);
  backdrop-filter: blur(10px);
}
#gameOverScreen .go-title {
  font-size: 36px; font-weight: 900; color: #ff4466;
  text-shadow: 0 0 20px rgba(255, 68, 102, 0.5);
  margin-bottom: 16px;
}
#gameOverScreen .go-score {
  font-size: 64px; font-weight: 900; color: #fff;
  margin-bottom: 8px;
}
#gameOverScreen .go-best {
  font-size: 18px; color: rgba(255,255,255,0.5); margin-bottom: 8px;
}
#gameOverScreen .go-coins {
  font-size: 22px; color: #ffd700; margin-bottom: 32px;
}
.btn-restart {
  background: linear-gradient(135deg, #ff4466, #ff6b8a);
  color: #fff; box-shadow: 0 8px 32px rgba(255, 68, 102, 0.4);
  margin-bottom: 12px;
}
.btn-restart:active { transform: scale(0.95); }
.btn-share {
  background: rgba(255,255,255,0.1); color: #fff;
  border: 2px solid rgba(255,255,255,0.2);
  padding: 12px 36px; font-size: 16px;
}

/* Rewarded Ad Placeholder */
.btn-revive {
  background: linear-gradient(135deg, #ffd700, #ffaa00);
  color: #000; box-shadow: 0 8px 32px rgba(255, 215, 0, 0.4);
  margin-bottom: 12px; font-size: 16px; padding: 14px 36px;
}
.btn-revive:active { transform: scale(0.95); }

/* Shop */
#shopBtn {
  position: fixed; bottom: 20px; right: 20px; z-index: 6;
  width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(135deg, #ffd700, #ffaa00);
  border: none; font-size: 28px; cursor: pointer;
  box-shadow: 0 4px 16px rgba(255, 215, 0, 0.4);
  display: none;
}

#shopScreen {
  background: rgba(10, 10, 46, 0.98);
}
#shopScreen .shop-title {
  font-size: 32px; font-weight: 900; color: #ffd700; margin-bottom: 24px;
}
.skin-grid {
  display: grid; grid-template-columns: repeat(3, 80px); gap: 16px;
  margin-bottom: 32px;
}
.skin-item {
  width: 80px; height: 80px; border-radius: 16px;
  border: 3px solid rgba(255,255,255,0.1);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s; position: relative;
}
.skin-item.selected { border-color: #6e3cff; box-shadow: 0 0 20px rgba(110,60,255,0.5); }
.skin-item.locked { opacity: 0.5; }
.skin-item .price {
  position: absolute; bottom: -8px;
  background: #ffd700; color: #000; font-size: 11px; font-weight: 700;
  padding: 2px 8px; border-radius: 10px;
}
.btn-back {
  background: rgba(255,255,255,0.1); color: #fff;
  border: 2px solid rgba(255,255,255,0.2);
  padding: 12px 36px; font-size: 16px;
}
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<!-- HUD -->
<div id="hud">
  <div class="score" id="scoreDisplay">0</div>
  <div class="coin-count" id="coinDisplay">рЯ™Щ 0</div>
</div>

<!-- Menu -->
<div class="overlay active" id="menuScreen">
  <div class="title">SKY BOUNCER</div>
  <div class="subtitle">–Я—А—Л–≥–∞–є –≤—Л—И–µ –≤—Б–µ—Е! рЯЪА</div>
  <button class="btn btn-play" id="playBtn">–Ш–≥—А–∞—В—М</button>
  <div class="best-score" id="menuBest">–Ы—Г—З—И–Є–є —А–µ–Ј—Г–ї—М—В–∞—В: 0</div>
</div>

<!-- Game Over -->
<div class="overlay" id="gameOverScreen" style="display:none;">
  <div class="go-title">–Ш–У–†–Р –Ю–Ъ–Ю–Э–І–Х–Э–Р</div>
  <div class="go-score" id="goScore">0</div>
  <div class="go-best" id="goBest">–Ы—Г—З—И–Є–є: 0</div>
  <div class="go-coins" id="goCoins">рЯ™Щ +0</div>
  <button class="btn btn-revive" id="reviveBtn">рЯУЇ –Я—А–Њ–і–Њ–ї–ґ–Є—В—М (—А–µ–Ї–ї–∞–Љ–∞)</button>
  <button class="btn btn-restart" id="restartBtn">–Ч–∞–љ–Њ–≤–Њ</button>
  <button class="btn btn-share" id="shareBtn">–Я–Њ–і–µ–ї–Є—В—М—Б—П</button>
</div>

<!-- Shop -->
<button id="shopBtn" style="display:none;">рЯЫТ</button>
<div class="overlay" id="shopScreen" style="display:none;">
  <div class="shop-title">рЯЫТ –Ь–∞–≥–∞–Ј–Є–љ</div>
  <div class="skin-grid" id="skinGrid"></div>
  <button class="btn btn-back" id="shopBackBtn">–Э–∞–Ј–∞–і</button>
</div>

<script>
// ============ GAME ENGINE ============
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Responsive canvas
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ============ GAME STATE ============
const GRAVITY = 0.45;
const JUMP_FORCE = -11;
const PLATFORM_GAP = 120;
const PLATFORM_SPEED_INITIAL = 1.5;

let gameState = 'menu'; // menu, playing, over
let score = 0;
let highScore = parseInt(localStorage.getItem('skyBouncer_high') || '0');
let totalCoins = parseInt(localStorage.getItem('skyBouncer_coins') || '0');
let sessionCoins = 0;
let selectedSkin = parseInt(localStorage.getItem('skyBouncer_skin') || '0');
let unlockedSkins = JSON.parse(localStorage.getItem('skyBouncer_skins') || '[0]');
let canRevive = true;
let cameraY = 0;
let maxHeight = 0;
let platformSpeed = PLATFORM_SPEED_INITIAL;
let particles = [];
let screenShake = 0;

// Player
const player = {
  x: 0, y: 0, vx: 0, vy: 0,
  w: 36, h: 36,
  onGround: false,
  facing: 1,
};

// Platforms
let platforms = [];

// Coins
let coins = [];

// Skins
const SKINS = [
  { name: '–Ъ—Г–±', color: '#6e3cff', price: 0 },
  { name: '–Ю–≥–Њ–љ—М', color: '#ff4444', price: 50 },
  { name: '–Ы—С–і', color: '#44ccff', price: 50 },
  { name: '–Ч–Њ–ї–Њ—В–Њ', color: '#ffd700', price: 100 },
  { name: '–Э–µ–Њ–љ', color: '#00ff88', price: 100 },
  { name: '–Ґ–µ–љ—М', color: '#333', price: 200 },
  { name: '–†–∞–і—Г–≥–∞', color: 'rainbow', price: 300 },
  { name: '–Я—А–Є–Ј—А–∞–Ї', color: 'rgba(255,255,255,0.4)', price: 500 },
  { name: '–Ъ–Њ—А–Њ–љ–∞', color: '#ff00ff', price: 1000 },
];

// ============ PLATFORM TYPES ============
function createPlatform(x, y, type) {
  const w = 70 + Math.random() * 40;
  return { x, y, w, h: 14, type: type || 'normal', vx: 0, broken: false, boost: false };
}

function generateInitialPlatforms() {
  platforms = [];
  coins = [];
  const startPlatform = createPlatform(canvas.width / 2 - 50, canvas.height - 80, 'normal');
  startPlatform.w = 120;
  platforms.push(startPlatform);

  for (let i = 1; i < 20; i++) {
    const x = Math.random() * (canvas.width - 100) + 20;
    const y = canvas.height - 80 - i * PLATFORM_GAP;
    const type = getRandomPlatformType(i);
    const p = createPlatform(x, y, type);
    if (type === 'moving') p.vx = (Math.random() > 0.5 ? 1 : -1) * (1 + Math.random());
    if (type === 'boost') p.boost = true;
    platforms.push(p);

    // Coins
    if (Math.random() < 0.35) {
      coins.push({ x: x + p.w / 2, y: y - 30, collected: false, r: 10 });
    }
  }
}

function getRandomPlatformType(height) {
  const r = Math.random();
  if (height < 5) return 'normal';
  if (r < 0.15) return 'moving';
  if (r < 0.25) return 'breaking';
  if (r < 0.32) return 'boost';
  return 'normal';
}

// ============ INPUT ============
let touchX = null;
let tiltX = 0;
let useTouch = false;

// Gyroscope (mobile)
window.addEventListener('deviceorientation', (e) => {
  if (e.gamma !== null) {
    tiltX = e.gamma / 30; // -1 to 1
    tiltX = Math.max(-1, Math.min(1, tiltX));
  }
});

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  useTouch = true;
  touchX = e.touches[0].clientX;
});
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  touchX = e.touches[0].clientX;
});
canvas.addEventListener('touchend', () => { touchX = null; });

// Keyboard
const keys = {};
window.addEventListener('keydown', (e) => { keys[e.key] = true; });
window.addEventListener('keyup', (e) => { keys[e.key] = false; });

// ============ PARTICLES ============
function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 1) * 4,
      life: 1,
      color,
      size: 3 + Math.random() * 4,
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life -= 0.025;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y - cameraY, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ============ GAME LOGIC ============
function startGame() {
  gameState = 'playing';
  score = 0;
  sessionCoins = 0;
  maxHeight = 0;
  cameraY = 0;
  platformSpeed = PLATFORM_SPEED_INITIAL;
  canRevive = true;
  particles = [];
  screenShake = 0;

  player.x = canvas.width / 2 - player.w / 2;
  player.y = canvas.height - 120;
  player.vx = 0;
  player.vy = 0;

  generateInitialPlatforms();

  document.getElementById('menuScreen').style.display = 'none';
  document.getElementById('menuScreen').classList.remove('active');
  document.getElementById('gameOverScreen').style.display = 'none';
  document.getElementById('gameOverScreen').classList.remove('active');
  document.getElementById('shopScreen').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('shopBtn').style.display = 'none';
}

function gameOver() {
  gameState = 'over';
  screenShake = 15;
  spawnParticles(player.x + player.w/2, player.y, '#ff4466', 20);

  if (score > highScore) {
    highScore = score;
    localStorage.setItem('skyBouncer_high', highScore);
  }
  totalCoins += sessionCoins;
  localStorage.setItem('skyBouncer_coins', totalCoins);

  document.getElementById('goScore').textContent = score;
  document.getElementById('goBest').textContent = '–Ы—Г—З—И–Є–є: ' + highScore;
  document.getElementById('goCoins').textContent = 'рЯ™Щ +' + sessionCoins;
  document.getElementById('reviveBtn').style.display = canRevive ? 'block' : 'none';

  setTimeout(() => {
    document.getElementById('gameOverScreen').style.display = 'flex';
    document.getElementById('gameOverScreen').classList.add('active');
    document.getElementById('hud').style.display = 'none';
  }, 400);
}

function revive() {
  canRevive = false;
  gameState = 'playing';
  player.vy = JUMP_FORCE;

  // Add platform under player
  platforms.push(createPlatform(player.x - 20, player.y + 50, 'normal'));

  document.getElementById('gameOverScreen').style.display = 'none';
  document.getElementById('gameOverScreen').classList.remove('active');
  document.getElementById('hud').style.display = 'flex';
}

function update() {
  if (gameState !== 'playing') return;

  // Input
  let moveDir = 0;
  if (keys['ArrowLeft'] || keys['a']) moveDir = -1;
  if (keys['ArrowRight'] || keys['d']) moveDir = 1;

  if (touchX !== null) {
    const center = canvas.width / 2;
    moveDir = (touchX - center) / (canvas.width / 2);
    moveDir = Math.max(-1, Math.min(1, moveDir));
  } else if (Math.abs(tiltX) > 0.05) {
    moveDir = tiltX;
  }

  player.vx = moveDir * 6;
  player.vy += GRAVITY;
  player.x += player.vx;
  player.y += player.vy;

  // Wrap around
  if (player.x + player.w < 0) player.x = canvas.width;
  if (player.x > canvas.width) player.x = -player.w;

  // Track direction
  if (moveDir !== 0) player.facing = moveDir > 0 ? 1 : -1;

  // Platform collision (only when falling)
  if (player.vy > 0) {
    for (const p of platforms) {
      if (p.broken) continue;
      if (
        player.x + player.w > p.x &&
        player.x < p.x + p.w &&
        player.y + player.h >= p.y &&
        player.y + player.h <= p.y + p.h + player.vy + 2
      ) {
        if (p.type === 'breaking') {
          p.broken = true;
          spawnParticles(p.x + p.w/2, p.y, '#aaa', 8);
          continue;
        }

        player.y = p.y - player.h;
        player.vy = p.boost ? JUMP_FORCE * 1.6 : JUMP_FORCE;
        player.onGround = true;

        spawnParticles(player.x + player.w/2, player.y + player.h,
          p.boost ? '#ffd700' : '#6e3cff', p.boost ? 12 : 5);

        if (p.boost) screenShake = 5;
      }
    }
  }

  // Move moving platforms
  for (const p of platforms) {
    if (p.type === 'moving') {
      p.x += p.vx;
      if (p.x <= 0 || p.x + p.w >= canvas.width) p.vx *= -1;
    }
  }

  // Camera follow
  const targetCameraY = player.y - canvas.height * 0.4;
  if (targetCameraY < cameraY) {
    cameraY += (targetCameraY - cameraY) * 0.1;
  }

  // Score based on height
  const currentHeight = Math.floor(-player.y / 10);
  if (currentHeight > score) score = currentHeight;

  // Height tracking for difficulty
  if (-player.y > maxHeight) maxHeight = -player.y;
  platformSpeed = PLATFORM_SPEED_INITIAL + maxHeight / 5000;

  // Collect coins
  for (const c of coins) {
    if (c.collected) continue;
    const dx = (player.x + player.w/2) - c.x;
    const dy = (player.y + player.h/2) - c.y;
    if (Math.sqrt(dx*dx + dy*dy) < 30) {
      c.collected = true;
      sessionCoins++;
      spawnParticles(c.x, c.y, '#ffd700', 8);
    }
  }

  // Generate new platforms above
  const highestPlatform = Math.min(...platforms.map(p => p.y));
  if (highestPlatform > cameraY - 200) {
    const newY = highestPlatform - PLATFORM_GAP - Math.random() * 30;
    const newX = Math.random() * (canvas.width - 100) + 20;
    const type = getRandomPlatformType(score);
    const p = createPlatform(newX, newY, type);
    if (type === 'moving') p.vx = (Math.random() > 0.5 ? 1 : -1) * (1 + Math.random() * platformSpeed);
    if (type === 'boost') p.boost = true;
    platforms.push(p);

    if (Math.random() < 0.35) {
      coins.push({ x: newX + p.w/2, y: newY - 30, collected: false, r: 10 });
    }
  }

  // Remove platforms below camera
  platforms = platforms.filter(p => p.y < cameraY + canvas.height + 100);
  coins = coins.filter(c => c.y < cameraY + canvas.height + 100);

  // Fall death
  if (player.y > cameraY + canvas.height + 50) {
    gameOver();
  }

  // Update HUD
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('coinDisplay').textContent = 'рЯ™Щ ' + sessionCoins;

  // Shake decay
  if (screenShake > 0) screenShake *= 0.85;

  updateParticles();
}

// ============ RENDERING ============
let bgStars = [];
for (let i = 0; i < 80; i++) {
  bgStars.push({
    x: Math.random() * 2000,
    y: Math.random() * 10000,
    size: Math.random() * 2 + 0.5,
    brightness: Math.random(),
  });
}

function getPlayerColor(t) {
  const skin = SKINS[selectedSkin];
  if (skin.color === 'rainbow') {
    const hue = (t * 2) % 360;
    return `hsl(${hue}, 100%, 60%)`;
  }
  return skin.color;
}

function draw(t) {
  // Background gradient based on height
  const heightFactor = Math.min(score / 500, 1);
  const r = Math.floor(10 + heightFactor * 10);
  const g = Math.floor(10 + heightFactor * 5);
  const b = Math.floor(46 + heightFactor * 30);
  ctx.fillStyle = `rgb(${r},${g},${b})`;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Screen shake
  ctx.save();
  if (screenShake > 0.5) {
    ctx.translate(
      (Math.random() - 0.5) * screenShake,
      (Math.random() - 0.5) * screenShake
    );
  }

  // Stars
  for (const s of bgStars) {
    const sy = (s.y - cameraY * 0.3) % canvas.height;
    const sx = (s.x) % canvas.width;
    ctx.globalAlpha = 0.3 + Math.sin(t / 1000 + s.brightness * 10) * 0.2;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(sx, sy, s.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Platforms
  for (const p of platforms) {
    if (p.broken) continue;
    const py = p.y - cameraY;
    if (py < -20 || py > canvas.height + 20) continue;

    let color;
    switch (p.type) {
      case 'normal': color = '#4a3aaa'; break;
      case 'moving': color = '#2288cc'; break;
      case 'breaking': color = '#886644'; break;
      case 'boost': color = '#ffaa00'; break;
    }

    // Platform glow
    ctx.shadowColor = color;
    ctx.shadowBlur = 12;

    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(p.x, py, p.w, p.h, 7);
    ctx.fill();

    // Top highlight
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.beginPath();
    ctx.roundRect(p.x + 2, py, p.w - 4, p.h / 2, [7, 7, 0, 0]);
    ctx.fill();

    ctx.shadowBlur = 0;

    // Boost indicator
    if (p.boost) {
      ctx.fillStyle = '#fff';
      ctx.font = '16px serif';
      ctx.textAlign = 'center';
      ctx.fillText('вђЖ', p.x + p.w/2, py - 4);
    }
  }

  // Coins
  for (const c of coins) {
    if (c.collected) continue;
    const cy = c.y - cameraY;
    if (cy < -20 || cy > canvas.height + 20) continue;

    const wobble = Math.sin(t / 300 + c.x) * 3;

    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 15;
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.arc(c.x, cy + wobble, c.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#ffee88';
    ctx.beginPath();
    ctx.arc(c.x - 2, cy + wobble - 2, c.r * 0.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Player
  if (gameState === 'playing' || gameState === 'over') {
    const px = player.x;
    const py = player.y - cameraY;
    const color = getPlayerColor(t);

    // Trail
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(px + player.w/2, py + player.h + 5, player.w * 0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // Body
    ctx.shadowColor = color;
    ctx.shadowBlur = 20;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(px, py, player.w, player.h, 8);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Eyes
    const eyeY = py + 12;
    const eyeX1 = px + (player.facing > 0 ? 10 : 16);
    const eyeX2 = px + (player.facing > 0 ? 22 : 28);
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(eyeX1, eyeY, 5, 0, Math.PI * 2);
    ctx.arc(eyeX2, eyeY, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(eyeX1 + player.facing * 1.5, eyeY, 2.5, 0, Math.PI * 2);
    ctx.arc(eyeX2 + player.facing * 1.5, eyeY, 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Crown for skin 8
    if (selectedSkin === 8) {
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.moveTo(px + 4, py);
      ctx.lineTo(px + 8, py - 10);
      ctx.lineTo(px + 14, py - 4);
      ctx.lineTo(px + 18, py - 12);
      ctx.lineTo(px + 22, py - 4);
      ctx.lineTo(px + 28, py - 10);
      ctx.lineTo(px + 32, py);
      ctx.fill();
    }
  }

  // Particles
  drawParticles();

  ctx.restore();
}

function gameLoop(t) {
  update();
  draw(t);
  requestAnimationFrame(gameLoop);
}

// Shop
function renderShop() {
  const grid = document.getElementById('skinGrid');
  grid.innerHTML = '';
  SKINS.forEach((skin, i) => {
    const div = document.createElement('div');
    div.className = 'skin-item' +
      (i === selectedSkin ? ' selected' : '') +
      (!unlockedSkins.includes(i) ? ' locked' : '');

    const colorStyle = skin.color === 'rainbow'
      ? 'background: conic-gradient(red, orange, yellow, green, blue, purple, red)'
      : `background: ${skin.color}`;

    div.innerHTML = `<div style="width:40px;height:40px;border-radius:8px;${colorStyle}"></div>`;

    if (!unlockedSkins.includes(i)) {
      div.innerHTML += `<span class="price">рЯ™Щ${skin.price}</span>`;
    }

    div.addEventListener('click', () => {
      if (unlockedSkins.includes(i)) {
        selectedSkin = i;
        localStorage.setItem('skyBouncer_skin', i);
        renderShop();
      } else if (totalCoins >= skin.price) {
        totalCoins -= skin.price;
        unlockedSkins.push(i);
        selectedSkin = i;
        localStorage.setItem('skyBouncer_coins', totalCoins);
        localStorage.setItem('skyBouncer_skins', JSON.stringify(unlockedSkins));
        localStorage.setItem('skyBouncer_skin', i);
        renderShop();
      }
    });

    grid.appendChild(div);
  });
}

    tg.HapticFeedback?.notificationOccurred('error');
  };
  // Patch gameOver
  window._tgGameOver = patchedGameOver;

  // Haptic on coin collect
  const origUpdate = update;
  let lastCoinCount = 0;
  const patchedUpdate = function() {
    origUpdate();
    if (sessionCoins > lastCoinCount) {
      lastCoinCount = sessionCoins;
      tg.HapticFeedback?.impactOccurred('light');
    }
  };

  // Replace in game loop
  const origGameLoop = gameLoop;
  window.gameLoop = function(t) {
    patchedUpdate();
    draw(t);
    requestAnimationFrame(window.gameLoop);
  };
  // Restart loop with patched version
  cancelAnimationFrame(window._rafId);
  function newLoop(t) {
    if (gameState === 'playing') {
      const prevCoins = sessionCoins;
      update();
      if (sessionCoins > prevCoins) {
        tg.HapticFeedback?.impactOccurred('light');
      }
    } else {
      update();
    }
    draw(t);
    requestAnimationFrame(newLoop);
  }

  // Back button handling
  tg.BackButton?.show();
  tg.BackButton?.onClick(() => {
    if (gameState === 'playing') {
      gameOver();
    } else {
      tg.close();
    }
  });
}

// ============ BACKEND API ============
const API_BASE = ''; // Same origin, or set to your backend URL

async function submitScore(finalScore, coinsEarned) {
  const tg = window.Telegram?.WebApp;
  if (!tg?.initData) return;
  try {
    const resp = await fetch(API_BASE + '/api/score', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        initData: tg.initData,
        score: finalScore,
        coins: coinsEarned,
      }),
    });
    const data = await resp.json();
    if (data.ok && data.new_high) {
      document.getElementById('goBest').textContent = 'рЯОЙ –Э–Њ–≤—Л–є —А–µ–Ї–Њ—А–і! #' + data.rank;
    }
  } catch (e) { /* offline вАФ ok */ }
}

async function loadLeaderboard() {
  try {
    const resp = await fetch(API_BASE + '/api/leaderboard?limit=10');
    const data = await resp.json();
    if (!data.ok) return;
    showLeaderboardUI(data.leaders);
  } catch (e) { /* offline */ }
}

function showLeaderboardUI(leaders) {
  let existing = document.getElementById('leaderboardPanel');
  if (existing) existing.remove();

  const panel = document.createElement('div');
  panel.id = 'leaderboardPanel';
  panel.className = 'overlay active';
  panel.style.cssText = 'background:rgba(10,10,46,0.98);z-index:20;display:flex;';

  const medals = ['рЯ•З','рЯ•И','рЯ•Й'];
  let html = '<div style="text-align:center;padding:20px;max-width:400px;width:100%">';
  html += '<div style="font-size:28px;font-weight:900;color:#ffd700;margin-bottom:20px">рЯПЖ –Ґ–Њ–њ –Є–≥—А–Њ–Ї–Њ–≤</div>';

  for (let i = 0; i < leaders.length; i++) {
    const l = leaders[i];
    const medal = i < 3 ? medals[i] : (i+1) + '.';
    const name = l.first_name || l.username || 'Anonymous';
    html += `<div style="display:flex;justify-content:space-between;padding:10px;color:#fff;font-size:16px;border-bottom:1px solid rgba(255,255,255,0.1)">
      <span>${medal} ${name}</span><span style="font-weight:700">${l.high_score}</span>
    </div>`;
  }

  html += '<button class="btn btn-back" onclick="document.getElementById(\'leaderboardPanel\').remove()" style="margin-top:20px">–Ч–∞–Ї—А—Л—В—М</button>';
  html += '</div>';
  panel.innerHTML = html;
  document.body.appendChild(panel);
}
